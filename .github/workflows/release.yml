name: Release

# Tag a commit v0.9.0 and push the tag: one installer per platform is built on its own runner -
# a macOS app cannot be produced anywhere else - and attached to the release the website links to.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The engine ships with the application and is not committed: GPL binary, its own licence.
      - run: npm run engine

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # Checksums, so a download can be verified against the release page.
      - run: |
          cd installers
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" installers/* --clobber --repo "${GITHUB_REPOSITORY}"
