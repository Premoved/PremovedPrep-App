name: Release

# Runs on a pushed v* tag. One installer per platform, each on its own runner: a macOS app
# cannot be produced anywhere else.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the job that attaches the files may write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The token only raises the GitHub API rate limit for the Stockfish release lookup.
      - run: npm run engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # The website links to these four names; a rename would publish a release it cannot reach.
      - run: |
          cd installers
          for name in PremovedPrep-Setup.exe PremovedPrep-Portable.exe PremovedPrep.dmg PremovedPrep.AppImage; do
            test -f "$name" || { echo "Missing $name"; ls -la; exit 1; }
          done

      # Checksums, so a download can be verified against the release page.
      - run: |
          cd installers
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # `gh release upload` needs the release to exist; a pushed tag alone does not create one.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
                 --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" installers/* --clobber --repo "${GITHUB_REPOSITORY}"