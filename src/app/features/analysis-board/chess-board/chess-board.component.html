<div
	class="board-shell"
	[class.narrow-layout]="layout.isNarrow()"
	[style.--square-size]="layout.squareSize() + 'px'"
	#boardShellEl
>
	<div class="board-row" #boardRowEl>
		<div
			class="board-column"
			#boardColumnEl
			[style.min-width.px]="layout.floorWidth()"
			[style.max-width.px]="layout.isNarrow() ? layout.floorWidth() : layout.ceilingWidth()"
		>
			<div class="board-square" [class.dests-dot]="moveDestStyle() === 'dot'" #boardSquareEl>
				<div #boardEl class="cg-board-wrapper"></div>

				@if (showVariationPicker()) {
					<app-variation-picker
						[variations]="pendingVariations()"
						[selectedIndex]="selectedIndex()"
						(pick)="pickVariation($event)"
						(dismiss)="showVariationPicker.set(false)"
						(highlight)="selectedIndex.set($event)"
					></app-variation-picker>
				}

				<app-promotion-overlay
					[target]="promotionData()"
					[overlayStyle]="promotionStyle()"
					(choose)="onPromotionChosen($event)"
					(cancelled)="cancelPromotion()"
				></app-promotion-overlay>

				@if (showImportModal()) {
					<app-import-dialog
						[initialFen]="importFen()"
						(loadFen)="confirmFenImport($event)"
						(loadPgn)="confirmPgnImport($event)"
						(closed)="showImportModal.set(false)"
					></app-import-dialog>
				}

				@if (isSetupMode()) {
					<app-setup-board
						[initialFen]="setupInitialFen()"
						[flipped]="setupStartsFlipped()"
						[narrow]="layout.isNarrow()"
						[stickToBoardTop]="layout.setupStickToBoardTop()"
						[bottomOffset]="layout.setupBottomOffset()"
						(previewFen)="onSetupPreview($event)"
						(confirmed)="onSetupConfirmed($event)"
						(cancelled)="cancelSetup()"
						(ready)="onSetupOverlayReady($event)"
					></app-setup-board>
				}
			</div>

			<div
				class="board-controls"
				#boardControlsEl
				[style.visibility]="layout.isNarrow() && isSetupMode() ? 'hidden' : null"
			>
				@if (!showUtilities) {
					<button type="button" class="flip" (click)="toggleOrientation()" title="Flip Board" aria-label="Flip Board">
						<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
							<g fill="currentColor">
								<path d="M1 1l5 6 4.94-6h-9.94z" />
								<path d="M5.94 10l-4.94 6h10zM3.12 15l2.83-3.44 3 3.44h-5.83z" />
								<path d="M10 8h1v1h-1v-1z" />
								<path d="M12 8h1v1h-1v-1z" />
								<path d="M8 8h1v1h-1v-1z" />
								<path d="M6 8h1v1h-1v-1z" />
								<path d="M4 8h1v1h-1v-1z" />
								<path d="M2 8h1v1h-1v-1z" />
								<path d="M0 8h1v1h-1v-1z" />
								<path
									d="M15 8.47v0c-0.059 1.485-0.782 2.789-1.879 3.632l-1.121-1.102v3h3l-1.18-1.18c1.293-1.031 2.128-2.588 2.18-4.342l0-0.008c-0.092-2.083-1.223-3.883-2.884-4.905l-0.596 0.805c1.423 0.857 2.383 2.357 2.479 4.087z"
								/>
							</g>
						</svg>
					</button>
				}
				<button type="button" (click)="goToRoot()" [disabled]="atStart()" title="Start">«</button>
				<button type="button" (click)="goBack()" [disabled]="atStart()" title="Back">‹</button>
				<button type="button" (click)="goForward()" [disabled]="!canStepForward()" title="Forward">›</button>
				<button type="button" (click)="goToLast()" [disabled]="!canStepForward()" title="End">»</button>
				@if (layout.isNarrow() && showUtilities) {
					<ng-container *ngTemplateOutlet="triggerBtn"></ng-container>
				}
			</div>
		</div>

										<path
											d="M15 8.47v0c-0.059 1.485-0.782 2.789-1.879 3.632l-1.121-1.102v3h3l-1.18-1.18c1.293-1.031 2.128-2.588 2.18-4.342l0-0.008c-0.092-2.083-1.223-3.883-2.884-4.905l-0.596 0.805c1.423 0.857 2.383 2.357 2.479 4.087z"
										/>
									</g>
								</svg>
							</span>
						</button>
					</div>
				}

				@if (!layout.isNarrow()) {
					<ng-container *ngTemplateOutlet="triggerBtn"></ng-container>
				}
			</div>
		}
	</div>
</div>

<ng-template #triggerBtn>
	<button
		type="button"
		class="action-trigger"
		[class.active]="showUtilityButtons()"
		(click)="toggleUtilityButtons()"
		aria-label="Utility menu"
		data-tooltip="Utility menu"
		(mouseenter)="showTooltip($event)"
		(contextmenu)="showTooltip($event)"
		(mouseleave)="hideTooltip()"
		(focus)="showTooltip($event)"
		(blur)="hideTooltip()"
	>
		<span class="trigger-icon">&#8801;</span>
	</button>
</ng-template>

@if (tooltip(); as tip) {
	<div class="utility-tooltip" [class.above]="tip.above" [style.left.px]="tip.x" [style.top.px]="tip.y">
		{{ tip.text }}
	</div>
}
